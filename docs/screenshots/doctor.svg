<tspan fill="#c3e88d">PASS</tspan>
<tspan fill="#d4d4d4">] #6 rules have teeth</tspan>
</text>
<text x="18" y="447" xml:space="preserve">
<tspan fill="#d4d4d4">      · 6 rules, all with declared enforcement</tspan>
</text>
<text x="18" y="466" xml:space="preserve">
<tspan fill="#d4d4d4">  [</tspan>
<tspan fill="#ffcb6b">WARN</tspan>
<tspan fill="#d4d4d4">] #7 secrets hygiene</tspan>
</text>
<text x="18" y="485" xml:space="preserve">
<tspan fill="#d4d4d4">      </tspan>
<tspan fill="#ffcb6b">⚠</tspan>
<tspan fill="#d4d4d4"> no pre-commit hook installed — install it via /cfm:code-review&#x27;s trigger section</tspan>
</text>
<text x="18" y="504" xml:space="preserve">
<tspan fill="#d4d4d4">      · .gitignore env coverage checked, .env.example values blank, no tracked secrets, settings denies present,</tspan>
</text>
<text x="18" y="523" xml:space="preserve">
<tspan fill="#d4d4d4">        sandbox OS-level denies present</tspan>
</text>
<text x="18" y="542" xml:space="preserve">
<tspan fill="#d4d4d4">      · the pre-commit hook stays WARN, not FAIL — it protects the human&#x27;s commits, not the agents&#x27; tool calls</tspan>
</text>
<text x="18" y="561" xml:space="preserve">
<tspan fill="#d4d4d4">  [</tspan>
<tspan fill="#c3e88d">PASS</tspan>
<tspan fill="#d4d4d4">] #8 pipeline wiring</tspan>
</text>
<text x="18" y="580" xml:space="preserve">
<tspan fill="#d4d4d4">      · plugin hook wiring intact (guard + stop review + session context)</tspan>
</text>
<text x="18" y="599" xml:space="preserve">
<tspan fill="#d4d4d4">      · guard self-test: secret read (path, stdin, glued redirect, git blob spec), secret Read, default-branch push,</tspan>
</text>
<text x="18" y="618" xml:space="preserve">
<tspan fill="#d4d4d4">        git env alias, and subagent writes to the config and settings (edit, redirect, download, patch, archive)</tspan>
</text>
<text x="18" y="637" xml:space="preserve">
<tspan fill="#d4d4d4">        all blocked; harmless calls and the main session&#x27;s config edit allowed; the main session&#x27;s product writes</tspan>
</text>
<text x="18" y="656" xml:space="preserve">
<tspan fill="#d4d4d4">        (Write, redirect, copy) blocked while its docs/ write and plugin-script runs are allowed (24 synthetic events)</tspan>
</text>
<text x="18" y="675" xml:space="preserve">
<tspan fill="#d4d4d4">      · cfm mode: enforced — session context injected at start/resume/compact, routing through /cfm:* skills</tspan>
</text>
<text x="18" y="694" xml:space="preserve">
<tspan fill="#d4d4d4">      · cfm status line on (mode and phase in the status bar)</tspan>
</text>
<text x="18" y="713" xml:space="preserve">
<tspan fill="#d4d4d4">      · subagent events observed live: the hook payload carried agent_id, so the policy-file rule fires on real dispatches</tspan>
</text>
<text x="18" y="732" xml:space="preserve">
<tspan fill="#d4d4d4">  [</tspan>
<tspan fill="#c3e88d">PASS</tspan>
<tspan fill="#d4d4d4">] #9 state</tspan>
</text>
<text x="18" y="751" xml:space="preserve">
<tspan fill="#d4d4d4">      · .cfm/state.json is schema-valid (v1); no orphaned in-flight phase</tspan>
</text>
<text x="18" y="770" xml:space="preserve">
<tspan fill="#d4d4d4">  verdict: </tspan>
<tspan fill="#c3e88d">healthy</tspan>
</text>
<text x="18" y="789" xml:space="preserve">
</text>
<text x="18" y="808" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">healthy</tspan>
