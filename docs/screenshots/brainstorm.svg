<svg xmlns="http://www.w3.org/2000/svg" width="796" height="581" viewBox="0 0 796 581" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.6">
<rect width="796" height="581" rx="10" fill="#1e1f24"/>
<rect width="796" height="40" rx="10" fill="#2a2b31"/>
<rect y="30" width="796" height="10" fill="#2a2b31"/>
<circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
<text x="398.0" y="24.5" text-anchor="middle" fill="#9a9ca5" font-size="12">cfm:brainstorm — an idea becomes docs/brief.md, zero setup questions</text>
<text x="18" y="67" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:brainstorm</tspan>
<tspan fill="#d4d4d4"> a tool that lets small teams track shared expenses and settle up</tspan>
</text>
<text x="18" y="86" xml:space="preserve">
</text>
<text x="18" y="105" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> Let&#x27;s think this through. One question at a time.</tspan>
</text>
<text x="18" y="124" xml:space="preserve">
</text>
<text x="18" y="143" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Problem.</tspan>
<tspan fill="#d4d4d4"> What hurts today when a group shares costs? Who feels it most, and how do they</tspan>
</text>
<text x="18" y="162" xml:space="preserve">
<tspan fill="#d4d4d4">  cope now — a spreadsheet, a group chat, one person&#x27;s memory?</tspan>
</text>
<text x="18" y="181" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> Flatmates. Someone pays for everything and chases people for months. Spreadsheet nobody updates.</tspan>
</text>
<text x="18" y="200" xml:space="preserve">
</text>
<text x="18" y="219" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Core value.</tspan>
<tspan fill="#d4d4d4"> If the tool did exactly one thing well, what would it be?</tspan>
</text>
<text x="18" y="238" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> You always know who owes whom, without anyone doing bookkeeping.</tspan>
</text>
<text x="18" y="257" xml:space="preserve">
</text>
<text x="18" y="276" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">MVP.</tspan>
<tspan fill="#d4d4d4"> You listed six features. For each: what breaks if it ships without it?</tspan>
</text>
<text x="18" y="295" xml:space="preserve">
<tspan fill="#d4d4d4">  · add an expense and split it            </tspan>
<tspan fill="#c3e88d">survives</tspan>
<tspan fill="#d4d4d4"> — the core loop</tspan>
</text>
<text x="18" y="314" xml:space="preserve">
<tspan fill="#d4d4d4">  · running balances per person            </tspan>
<tspan fill="#c3e88d">survives</tspan>
<tspan fill="#d4d4d4"> — the value itself</tspan>
</text>
<text x="18" y="333" xml:space="preserve">
<tspan fill="#d4d4d4">  · settle up (record a repayment)         </tspan>
<tspan fill="#c3e88d">survives</tspan>
<tspan fill="#d4d4d4"> — balances never reach zero without it</tspan>
</text>
<text x="18" y="352" xml:space="preserve">
<tspan fill="#d4d4d4">  · receipt photo upload                   </tspan>
<tspan fill="#ffcb6b">deferred</tspan>
<tspan fill="#d4d4d4"> — nothing breaks; it&#x27;s a non-goal for now</tspan>
</text>
<text x="18" y="371" xml:space="preserve">
<tspan fill="#d4d4d4">  · recurring expenses                     </tspan>
<tspan fill="#ffcb6b">deferred</tspan>
<tspan fill="#d4d4d4"> — no persona asked for it</tspan>
</text>
<text x="18" y="390" xml:space="preserve">
<tspan fill="#d4d4d4">  · multi-currency                         </tspan>
<tspan fill="#ffcb6b">open question</tspan>
<tspan fill="#d4d4d4"> — depends on who the first users are</tspan>
</text>
<text x="18" y="409" xml:space="preserve">
</text>
<text x="18" y="428" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#6b7280">(You asked whether to use Postgres — noted under Open questions for the architecture round.</tspan>
</text>
<text x="18" y="447" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#6b7280">This step stays config-free.)</tspan>
</text>
<text x="18" y="466" xml:space="preserve">
</text>
<text x="18" y="485" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Write</tspan>
<tspan fill="#d4d4d4">(docs/brief.md)</tspan>
</text>
<text x="18" y="504" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  Wrote 61 lines: problem · personas · MVP features (with whys) · non-goals · open questions</tspan>
</text>
<text x="18" y="523" xml:space="preserve">
</text>
<text x="18" y="542" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> The brief is written and nothing else was created. </tspan>
<tspan fill="#ffffff" font-weight="bold">Move to development?</tspan>
<tspan fill="#d4d4d4"> If yes, run</tspan>
</text>
<text x="18" y="561" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:init</tspan>
<tspan fill="#d4d4d4"> — it runs the architecture round and writes the config. If not yet, you&#x27;re done.</tspan>
</text>
</svg>
