<text x="439.5" y="24.5" text-anchor="middle" fill="#9a9ca5" font-size="12">cfm:init — detect the scenario, interview, write config, scaffold, prove it green</text>
<text x="18" y="67" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:init</tspan>
</text>
<text x="18" y="86" xml:space="preserve">
</text>
<text x="18" y="105" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/init_scan.py --project-dir .)</tspan>
</text>
<text x="18" y="124" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  {&quot;scenario&quot;: &quot;greenfield&quot;, &quot;signals&quot;: {&quot;manifests&quot;: [], &quot;source_files&quot;: 0, &quot;git_repo&quot;: true}}</tspan>
</text>
<text x="18" y="143" xml:space="preserve">
</text>
<text x="18" y="162" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> Empty directory with a brief — </tspan>
<tspan fill="#ffffff" font-weight="bold">greenfield</tspan>
<tspan fill="#d4d4d4">. I&#x27;ll ask only what the config needs.</tspan>
</text>
<text x="18" y="181" xml:space="preserve">
</text>
<text x="18" y="200" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Stack?                → </tspan>
<tspan fill="#c3e88d">TypeScript · Fastify · Postgres (Drizzle)</tspan>
</text>
<text x="18" y="219" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Layers, in build order? → </tspan>
<tspan fill="#c3e88d">database → api → web</tspan>
</text>
<text x="18" y="238" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Git autonomy?          → </tspan>
<tspan fill="#c3e88d">L0 — agents never touch git (default)</tspan>
</text>
<text x="18" y="257" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Roster?                → </tspan>
<tspan fill="#c3e88d">default 9 agents; ui-design activates for web</tspan>
</text>
<text x="18" y="276" xml:space="preserve">
</text>
<text x="18" y="295" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Architecture round</tspan>
<tspan fill="#d4d4d4"> — each answer is routed to config (enforceable) or an ADR (rationale):</tspan>
</text>
<text x="18" y="314" xml:space="preserve">
<tspan fill="#d4d4d4">  · migrations: Drizzle Kit          → </tspan>
<tspan fill="#89ddff">commands.migrate_generate / migrate_apply</tspan>
</text>
<text x="18" y="333" xml:space="preserve">
<tspan fill="#d4d4d4">  · tenancy: none (single household) → </tspan>
<tspan fill="#89ddff">tenancy.scope_field: null</tspan>
</text>
<text x="18" y="352" xml:space="preserve">
<tspan fill="#d4d4d4">  · money as integer minor units     → </tspan>
<tspan fill="#89ddff">docs/adr/0001-store-money-as-integer-minor-units.md</tspan>
</text>
<text x="18" y="371" xml:space="preserve">
</text>
<text x="18" y="390" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Conventions round</tspan>
<tspan fill="#d4d4d4"> — 8 categories, each pick becomes a numbered rule with an owner:</tspan>
</text>
<text x="18" y="409" xml:space="preserve">
<tspan fill="#d4d4d4">  R3 camelCase symbols, no abbreviations (</tspan>
<tspan fill="#89ddff">lint(naming)</tspan>
<tspan fill="#d4d4d4">) · R4 one export per file (</tspan>
<tspan fill="#89ddff">reviewer(code-reviewer)</tspan>
<tspan fill="#d4d4d4">)</tspan>
</text>
<text x="18" y="428" xml:space="preserve">
<tspan fill="#d4d4d4">  R5 no cross-feature imports (</tspan>
<tspan fill="#89ddff">lint(lint_arch)</tspan>
<tspan fill="#d4d4d4">) · R6 errors extend AppError (</tspan>
<tspan fill="#89ddff">reviewer(security-check)</tspan>
<tspan fill="#d4d4d4">)</tspan>
</text>
<text x="18" y="447" xml:space="preserve">
</text>
<text x="18" y="466" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Write</tspan>
<tspan fill="#d4d4d4">(.cfm-workflow.yml)                                     </tspan>
<tspan fill="#6b7280">— shown as a diff, applied on approval</tspan>
</text>
<text x="18" y="485" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/scaffold.py --project-dir .)</tspan>
</text>
<text x="18" y="504" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  written CLAUDE.md, .claude/rules/rules.md, CONTEXT.md, .env.example, docs/PROGRESS.md, .cfm/state.json</tspan>
</text>
<text x="18" y="523" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Agent</tspan>
<tspan fill="#d4d4d4">(coder) — stack skeleton: package.json, tsconfig, drizzle.config.ts, one green test</tspan>
</text>
<text x="18" y="542" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  Done (34.1k tokens). Did NOT run: verify_full (human&#x27;s command)</tspan>
</text>
<text x="18" y="561" xml:space="preserve">
</text>
<text x="18" y="580" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Prove the lint teeth.</tspan>
<tspan fill="#d4d4d4"> R3 is claimed lint-enforced — the coder writes a deliberate violation:</tspan>
</text>
<text x="18" y="599" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Agent</tspan>
<tspan fill="#d4d4d4">(mechanical-gate) — lint</tspan>
</text>
<text x="18" y="618" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  lint: </tspan>
<tspan fill="#f07178">FAIL (exit 1)</tspan>
<tspan fill="#d4d4d4">  src/tmp/badName.ts:1  identifier &#x27;usr_cnt&#x27; is not camelCase   </tspan>
<tspan fill="#c3e88d">← it bites; R3 stands</tspan>
</text>
<text x="18" y="637" xml:space="preserve">
</text>
<text x="18" y="656" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/gen_settings.py --project-dir . --write)</tspan>
</text>
<text x="18" y="675" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  341 deny rules written to .claude/settings.json (recorded in .claude/cfm-denies.json)</tspan>
</text>
<text x="18" y="694" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/doctor.py --project-dir .)</tspan>
</text>
<text x="18" y="713" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  verdict: </tspan>
<tspan fill="#c3e88d">healthy</tspan>
<tspan fill="#d4d4d4"> — 10 checks, 0 failures</tspan>
</text>
<text x="18" y="732" xml:space="preserve">
</text>
<text x="18" y="751" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> cfm is set up. Next: </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:plan</tspan>
<tspan fill="#d4d4d4"> for the first feature, or </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:configure</tspan>
<tspan fill="#d4d4d4"> to tune anything.</tspan>
</text>
</svg>
