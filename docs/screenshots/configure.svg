<svg xmlns="http://www.w3.org/2000/svg" width="849" height="714" viewBox="0 0 849 714" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.6">
<rect width="849" height="714" rx="10" fill="#1e1f24"/>
<rect width="849" height="40" rx="10" fill="#2a2b31"/>
<rect y="30" width="849" height="10" fill="#2a2b31"/>
<circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="40" cy="20" r="6" fill="#febc2e"/><circle cx="60" cy="20" r="6" fill="#28c840"/>
<text x="424.5" y="24.5" text-anchor="middle" fill="#9a9ca5" font-size="12">cfm:configure — current value → YAML diff → explicit apply → automatic doctor</text>
<text x="18" y="67" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:configure</tspan>
<tspan fill="#d4d4d4"> git level L1</tspan>
</text>
<text x="18" y="86" xml:space="preserve">
</text>
<text x="18" y="105" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/cfm_config.py --project-dir . --json)</tspan>
</text>
<text x="18" y="124" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> git.level is </tspan>
<tspan fill="#ffffff" font-weight="bold">L0</tspan>
<tspan fill="#d4d4d4"> (agents never touch git). L1 grants local commits: add, commit, stash,</tspan>
</text>
<text x="18" y="143" xml:space="preserve">
<tspan fill="#d4d4d4">  restore, cherry-pick, revert, am, apply. Pushes, branches, and the default branch stay yours.</tspan>
</text>
<text x="18" y="162" xml:space="preserve">
</text>
<text x="18" y="181" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#6b7280">--- a/.cfm-workflow.yml</tspan>
</text>
<text x="18" y="200" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#6b7280">+++ b/.cfm-workflow.yml</tspan>
</text>
<text x="18" y="219" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#89ddff">@@ -55,3 +55,3 @@</tspan>
</text>
<text x="18" y="238" xml:space="preserve">
<tspan fill="#d4d4d4">   git:</tspan>
</text>
<text x="18" y="257" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#f07178">-  level: L0</tspan>
</text>
<text x="18" y="276" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#c3e88d">+  level: L1</tspan>
</text>
<text x="18" y="295" xml:space="preserve">
<tspan fill="#d4d4d4">     branch_prefixes: [feature/, project/, hotfix/, chore/]</tspan>
</text>
<text x="18" y="314" xml:space="preserve">
</text>
<text x="18" y="333" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#ffffff" font-weight="bold">Consequences:</tspan>
<tspan fill="#d4d4d4"> the coder may commit locally after each layer; still no push, no branch</tspan>
</text>
<text x="18" y="352" xml:space="preserve">
<tspan fill="#d4d4d4">  delete, no push to main, no git aliases, no `git config` writes — those hold at every level.</tspan>
</text>
<text x="18" y="371" xml:space="preserve">
</text>
<text x="18" y="390" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Apply this change?  → </tspan>
<tspan fill="#c3e88d">Yes</tspan>
</text>
<text x="18" y="409" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Edit</tspan>
<tspan fill="#d4d4d4">(.cfm-workflow.yml)                                             </tspan>
<tspan fill="#6b7280">— surgical: one line</tspan>
</text>
<text x="18" y="428" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/cfm_config.py --project-dir .)</tspan>
</text>
<text x="18" y="447" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  ok</tspan>
</text>
<text x="18" y="466" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/doctor.py --project-dir .)</tspan>
</text>
<text x="18" y="485" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  [</tspan>
<tspan fill="#f07178">FAIL</tspan>
<tspan fill="#d4d4d4">] #7 secrets hygiene</tspan>
</text>
<text x="18" y="504" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">      ✘ 10 stale deny entries in .claude/settings.json from an earlier config (Bash(git add:*),</tspan>
</text>
<text x="18" y="523" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">        Bash(git commit:*), …) — the permission layer contradicts the config; run gen_settings --write</tspan>
</text>
<text x="18" y="542" xml:space="preserve">
</text>
<text x="18" y="561" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> The settings denies still say L0. cfm owns those rules, so regenerating </tspan>
<tspan fill="#ffffff" font-weight="bold">retracts</tspan>
<tspan fill="#d4d4d4"> the ten</tspan>
</text>
<text x="18" y="580" xml:space="preserve">
<tspan fill="#d4d4d4">  the new level grants and keeps everything you wrote yourself:</tspan>
</text>
<text x="18" y="599" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(python3 $CLAUDE_PLUGIN_ROOT/scripts/gen_settings.py --project-dir .)          </tspan>
<tspan fill="#6b7280">— diff shown</tspan>
</text>
<text x="18" y="618" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">AskUserQuestion</tspan>
<tspan fill="#d4d4d4">  Write the settings?  → </tspan>
<tspan fill="#c3e88d">Yes</tspan>
</text>
<text x="18" y="637" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(… gen_settings.py --project-dir . --write)</tspan>
</text>
<text x="18" y="656" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  retracted 10 stale denies: Bash(git add:*), Bash(git am:*), Bash(git apply:*), Bash(git commit:*), …</tspan>
</text>
<text x="18" y="675" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Bash</tspan>
<tspan fill="#d4d4d4">(… doctor.py --project-dir .)</tspan>
</text>
<text x="18" y="694" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#8a8f98">⎿</tspan>
<tspan fill="#d4d4d4">  verdict: </tspan>
<tspan fill="#c3e88d">healthy</tspan>
</text>
</svg>
