<text x="417.0" y="24.5" text-anchor="middle" fill="#9a9ca5" font-size="12">cfm:plan — a feature becomes phases grounded in the real code, approved in plan mode</text>
<text x="18" y="67" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:plan</tspan>
<tspan fill="#d4d4d4"> expense splitting</tspan>
</text>
<text x="18" y="86" xml:space="preserve">
</text>
<text x="18" y="105" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">EnterPlanMode</tspan>
</text>
<text x="18" y="124" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Read</tspan>
<tspan fill="#d4d4d4">(docs/brief.md)  </tspan>
<tspan fill="#ffffff" font-weight="bold">Read</tspan>
<tspan fill="#d4d4d4">(CONTEXT.md)  </tspan>
<tspan fill="#ffffff" font-weight="bold">Read</tspan>
<tspan fill="#d4d4d4">(domain/database/src/households/*.ts)</tspan>
</text>
<text x="18" y="143" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> Grounded in the actual code: households already own the `Member` table and the</tspan>
</text>
<text x="18" y="162" xml:space="preserve">
<tspan fill="#d4d4d4">  `HouseholdRepository` shape — the plan reuses both rather than inventing a second pattern.</tspan>
</text>
<text x="18" y="181" xml:space="preserve">
</text>
<text x="18" y="200" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Plan: expense-splitting</tspan>
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#6b7280">(docs/plans/expense-splitting.md, status: draft)</tspan>
</text>
<text x="18" y="219" xml:space="preserve">
</text>
<text x="18" y="238" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#ffffff" font-weight="bold">Phase 1 — expense-ledger</tspan>
<tspan fill="#d4d4d4">   layers: database</tspan>
</text>
<text x="18" y="257" xml:space="preserve">
<tspan fill="#d4d4d4">    scope    domain/database/src/expenses/{schema,repository}.ts + migration</tspan>
</text>
<text x="18" y="276" xml:space="preserve">
<tspan fill="#d4d4d4">    AC       an Expense records payer, amount (minor units), and one Share per member</tspan>
</text>
<text x="18" y="295" xml:space="preserve">
<tspan fill="#d4d4d4">    seams    the `ExpenseRepository` public interface</tspan>
</text>
<text x="18" y="314" xml:space="preserve">
<tspan fill="#d4d4d4">    tests    insert an expense with 3 shares → shares sum to the amount; a share for a non-member fails</tspan>
</text>
<text x="18" y="333" xml:space="preserve">
</text>
<text x="18" y="352" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#ffffff" font-weight="bold">Phase 2 — balances</tspan>
<tspan fill="#d4d4d4">          layers: database, api</tspan>
</text>
<text x="18" y="371" xml:space="preserve">
<tspan fill="#d4d4d4">    scope    domain/database/src/balances/*.ts · apps/api/src/balances/{route,handler}.ts</tspan>
</text>
<text x="18" y="390" xml:space="preserve">
<tspan fill="#d4d4d4">    AC       GET /households/:id/balances returns who owes whom, net, in minor units</tspan>
</text>
<text x="18" y="409" xml:space="preserve">
<tspan fill="#d4d4d4">    seams    `POST /expenses` and `GET /households/:id/balances`</tspan>
</text>
<text x="18" y="428" xml:space="preserve">
<tspan fill="#d4d4d4">    tests    two expenses paid by different members → the net matrix is antisymmetric</tspan>
</text>
<text x="18" y="447" xml:space="preserve">
</text>
<text x="18" y="466" xml:space="preserve">
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#ffffff" font-weight="bold">Phase 3 — settle-up</tspan>
<tspan fill="#d4d4d4">         layers: database, api, web</tspan>
</text>
<text x="18" y="485" xml:space="preserve">
<tspan fill="#d4d4d4">    </tspan>
<tspan fill="#6b7280">…</tspan>
</text>
<text x="18" y="504" xml:space="preserve">
</text>
<text x="18" y="523" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">YAGNI pass:</tspan>
<tspan fill="#d4d4d4"> Phase 2 AC-4 (&quot;balances can be exported as CSV&quot;) is speculative — no persona</tspan>
</text>
<text x="18" y="542" xml:space="preserve">
<tspan fill="#d4d4d4">  in the brief reaches it. Recommend cutting; your call at the gate.</tspan>
</text>
<text x="18" y="561" xml:space="preserve">
</text>
<text x="18" y="580" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">ExitPlanMode</tspan>
<tspan fill="#d4d4d4">  </tspan>
<tspan fill="#6b7280">— the plan-mode approval gate IS the approval</tspan>
</text>
<text x="18" y="599" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#c3e88d">Approved</tspan>
<tspan fill="#d4d4d4"> — cut AC-4</tspan>
</text>
<text x="18" y="618" xml:space="preserve">
<tspan fill="#82aaff">⏺</tspan>
<tspan fill="#d4d4d4"> </tspan>
<tspan fill="#ffffff" font-weight="bold">Write</tspan>
<tspan fill="#d4d4d4">(docs/plans/expense-splitting.md)</tspan>
</text>
<text x="18" y="637" xml:space="preserve">
</text>
<text x="18" y="656" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> Greenfield project, first plan approved — one question, once: connect a tracker (Jira, ClickUp,</tspan>
</text>
<text x="18" y="675" xml:space="preserve">
<tspan fill="#d4d4d4">  Trello) so phases mirror as tasks? </tspan>
<tspan fill="#6b7280">(/cfm:connect-tracker any time later)</tspan>
</text>
<text x="18" y="694" xml:space="preserve">
<tspan fill="#c792ea">❯</tspan>
<tspan fill="#d4d4d4"> not now</tspan>
</text>
<text x="18" y="713" xml:space="preserve">
<tspan fill="#89ddff">●</tspan>
<tspan fill="#d4d4d4"> Noted in state as declined. Start with </tspan>
<tspan fill="#ffffff" font-weight="bold">/cfm:implement-phase expense-ledger</tspan>
<tspan fill="#d4d4d4">.</tspan>
</text>
