# Breaks doctor check #1 hard invariants: wrong surface, shrunk secret_globs.
cfm:
  schema_version: 2
  requires:
    surface: cowork

profile: supervised
project_context: >
  Broken-invariant fixture.

layers:
  - { name: api, path: apps/api }

claude_md:
  layout: single
  files: [CLAUDE.md]

commands:
  lint: ["true"]
  verify_full: "true"

agents:
  coder:
    enabled: true
    purpose: "Implements features"
    model: claude-sonnet-5
    tier: implementation
    autonomy: auto
    tools: [Read, Write, Edit, Bash]
    layers: [api]
  code-reviewer:
    enabled: true
    purpose: "Keeps rules-valid.md's reviewer() enforcement live (check #6)"
    model: claude-fable-5
    tier: judgment
    autonomy: auto
    tools: [Read]
    layers: [api]

review_gates: []

secret_globs:
  - ".env*"

git:
  level: L0
